<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Event | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden">
        <div class="bg-orange-600 text-white p-6">
            <h2 class="text-2xl font-bold">Edit Event</h2>
            <p class="text-orange-100 text-sm mt-1">Updating details for {{ event.title_english }}</p>
        </div>
        
        <form action="{{ url_for('edit_event', id=event.id) }}" method="POST" class="p-6 space-y-5">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Kannada Title</label>
                    <input type="text" name="title" value="{{ event.title }}" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">English Subtitle</label>
                    <input type="text" name="title_english" value="{{ event.title_english }}" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Description</label>
                <textarea name="description" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none resize-none" rows="3">{{ event.description }}</textarea>
            </div>
            
            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Time</label>
                    <input type="text" name="time" value="{{ event.time }}" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Date</label>
                    <input type="text" name="date" value="{{ event.date }}" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Icon Class</label>
                    <input type="text" name="icon" value="{{ event.icon }}" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none">
                </div>
            </div>

            <div class="flex gap-4 pt-4 border-t border-gray-100">
                <a href="{{ url_for('admin') }}" class="w-1/3 text-center bg-gray-200 text-gray-700 font-bold py-3 rounded-xl hover:bg-gray-300 transition-all">Cancel</a>
                <button type="submit" class="w-2/3 bg-orange-600 text-white font-bold py-3 rounded-xl hover:bg-orange-700 transition-all shadow-lg hover:-translate-y-0.5">Save Changes</button>
            </div>
        </form>
    </div>
</body>
</html>
