<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Team Member | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden">
        <div class="bg-blue-600 text-white p-6">
            <h2 class="text-2xl font-bold">Edit Team Member</h2>
            <p class="text-blue-100 text-sm mt-1">Updating details for {{ member.name }}</p>
        </div>
        
        <form action="{{ url_for('edit_team', id=member.id) }}" method="POST" enctype="multipart/form-data" class="p-6 space-y-5">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Full Name</label>
                <input type="text" name="name" value="{{ member.name }}" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Role Assignment</label>
                    <select name="role" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none">
                        <option value="President" {% if member.role == 'President' %}selected{% endif %}>President</option>
                        <option value="Secretary" {% if member.role == 'Secretary' %}selected{% endif %}>Secretary</option>
                        <option value="Treasurer" {% if member.role == 'Treasurer' %}selected{% endif %}>Treasurer</option>
                        <option value="Coordinator" {% if member.role == 'Coordinator' %}selected{% endif %}>Coordinator</option>
                        <option value="Volunteer" {% if member.role == 'Volunteer' %}selected{% endif %}>Volunteer</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Kannada Role</label>
                    <input type="text" name="role_kannada" value="{{ member.role_kannada }}" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Current Photo</label>
                <img src="{{ url_for('static', filename='images/uploads/' + member.image_file) }}" class="w-20 h-20 rounded-lg object-cover mb-2 border border-gray-200">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Upload New Photo (Optional)</label>
                <input type="file" name="image" accept="image/*" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 text-sm">
                <p class="text-xs text-gray-400 mt-1">Leave blank to keep the current photo.</p>
            </div>

            <div class="flex gap-4 pt-4 border-t border-gray-100">
                <a href="{{ url_for('admin') }}" class="w-1/3 text-center bg-gray-200 text-gray-700 font-bold py-3 rounded-xl hover:bg-gray-300 transition-all">Cancel</a>
                <button type="submit" class="w-2/3 bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition-all shadow-lg hover:-translate-y-0.5">Save Changes</button>
            </div>
        </form>
    </div>
</body>
</html>
