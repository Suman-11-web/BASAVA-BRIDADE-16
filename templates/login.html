<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Admin Login | Hadinaru Ganeshotsava 2027</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { dark: '#0a0a0a', maroon: '#2a0808', gold: '#e0b85a' },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-dark text-gray-800 font-sans min-h-screen flex items-center justify-center relative overflow-hidden">

    <!-- Cinematic Background -->
    <div class="absolute inset-0 z-0">
        <img src="{{ url_for('static', filename='images/hero-bg.jpg') }}" class="w-full h-full object-cover opacity-40 blur-[2px]" alt="Background">
        <div class="absolute inset-0 bg-gradient-to-br from-dark/95 via-maroon/90 to-dark/95 backdrop-blur-sm"></div>
    </div>

    <!-- Floating Lights -->
    <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-gold/20 rounded-full blur-[100px] pointer-events-none animate-pulse"></div>
    <div class="absolute bottom-1/4 right-1/4 w-72 h-72 bg-pink-500/10 rounded-full blur-[100px] pointer-events-none animate-pulse" style="animation-delay: 1s;"></div>

    <!-- Glassmorphism Login Card -->
    <div class="relative z-10 w-full max-w-md px-6">
        
        <!-- Logo Header -->
        <div class="text-center mb-8 transform hover:scale-105 transition duration-500">
            <a href="{{ url_for('index') }}" class="inline-block">
                <img src="{{ url_for('static', filename='images/logo.png') }}" class="w-20 h-20 mx-auto drop-shadow-[0_0_15px_rgba(224,184,90,0.8)] mb-4" alt="Logo">
                <h1 class="text-2xl font-bold text-white tracking-wide">Admin Access</h1>
                <p class="text-gold text-xs uppercase tracking-[0.3em] mt-1">Basava Brigade Secure Portal</p>
            </a>
        </div>

        <div class="bg-white/10 backdrop-blur-xl p-8 rounded-3xl border border-white/20 shadow-[0_0_40px_rgba(0,0,0,0.5)] relative overflow-hidden">
            <!-- Decorative corner glow -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-gold/20 rounded-full blur-2xl"></div>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        {% if category == 'error' %}
                        <div class="bg-red-500/20 border border-red-500/50 text-red-100 px-4 py-3 rounded-xl mb-6 text-sm flex items-center gap-3 backdrop-blur-md">
                            <i class="fa-solid fa-circle-exclamation"></i> {{ message }}
                        </div>
                        {% endif %}
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="POST" class="space-y-6 relative z-10">
                <!-- Username -->
                <div>
                    <label class="block text-xs font-bold text-gray-300 uppercase tracking-widest mb-2 ml-1">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-user text-gold"></i>
                        </div>
                        <input type="text" name="username" required placeholder="Enter admin username" 
                               class="w-full pl-11 pr-4 py-3.5 bg-dark/50 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-gold focus:border-transparent transition-all">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-xs font-bold text-gray-300 uppercase tracking-widest mb-2 ml-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-gold"></i>
                        </div>
                        <input type="password" name="password" id="password" required placeholder="••••••••" 
                               class="w-full pl-11 pr-12 py-3.5 bg-dark/50 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-gold focus:border-transparent transition-all">
                        <!-- Show/Hide Password Toggle -->
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer text-gray-400 hover:text-gold transition-colors" onclick="togglePassword()">
                            <i class="fa-solid fa-eye" id="eye-icon"></i>
                        </div>
                    </div>
                </div>

                <!-- Login Button -->
                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-gold to-yellow-600 text-dark font-bold text-lg rounded-xl shadow-[0_0_15px_rgba(224,184,90,0.4)] hover:shadow-[0_0_25px_rgba(224,184,90,0.7)] transform hover:-translate-y-1 transition-all duration-300 mt-4">
                    Secure Login &rarr;
                </button>
            </form>
        </div>
        
        <div class="text-center mt-6">
            <a href="{{ url_for('index') }}" class="text-gray-400 hover:text-white text-sm transition-colors border-b border-transparent hover:border-white pb-1"><i class="fa-solid fa-arrow-left mr-2"></i> Return to main site</a>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
